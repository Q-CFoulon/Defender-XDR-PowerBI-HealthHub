services:
  healthhub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defender-xdr-powerbi-healthhub
    restart: unless-stopped
    ports:
      - "4010:4010"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:4010/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
